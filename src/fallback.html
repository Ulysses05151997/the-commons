<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Compute Commons</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #1a1a1a; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.logo { width: 160px; height: 160px; margin-bottom: 24px; }
h1 { font-size: 28px; color: #F5F0E8; margin-bottom: 6px; font-weight: 600; }
.subtitle { color: #888; font-size: 15px; margin-bottom: 32px; }
.search-form { display: flex; gap: 8px; }
.search-input {
  width: 420px;
  height: 42px;
  padding: 0 14px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #252525;
  color: #e0e0e0;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: #8B1A1A; }
.search-btn {
  height: 42px;
  padding: 0 22px;
  border: none;
  border-radius: 8px;
  background: #8B1A1A;
  color: #F5F0E8;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.search-btn:hover { background: #A02020; }
.link { margin-top: 24px; }
.link a { color: #8B1A1A; text-decoration: none; font-size: 13px; }
.link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="256" cy="410" rx="180" ry="50" fill="#E8E0D8" opacity="0.6"/>
    <ellipse cx="256" cy="400" rx="160" ry="40" fill="#F5F0E8"/>
    <g transform="translate(95,370)"><rect width="28" height="28" rx="3" fill="#556B2F" opacity="0.8"/><rect x="6" y="6" width="16" height="16" rx="1" fill="#3D4F22"/></g>
    <g transform="translate(389,370)"><rect width="32" height="22" rx="3" fill="#556B2F" opacity="0.8"/><rect x="4" y="4" width="10" height="14" rx="1" fill="#3D4F22"/><rect x="18" y="4" width="10" height="14" rx="1" fill="#3D4F22"/></g>
    <ellipse cx="256" cy="310" rx="75" ry="95" fill="#2D2D2D"/>
    <ellipse cx="256" cy="320" rx="50" ry="70" fill="#F5F0E8"/>
    <ellipse cx="228" cy="395" rx="22" ry="10" fill="#CD853F"/>
    <ellipse cx="284" cy="395" rx="22" ry="10" fill="#CD853F"/>
    <ellipse cx="178" cy="300" rx="18" ry="55" transform="rotate(10,178,300)" fill="#2D2D2D"/>
    <ellipse cx="334" cy="300" rx="18" ry="55" transform="rotate(-10,334,300)" fill="#2D2D2D"/>
    <circle cx="256" cy="205" r="60" fill="#2D2D2D"/>
    <ellipse cx="256" cy="215" rx="42" ry="35" fill="#F5F0E8"/>
    <circle cx="238" cy="200" r="8" fill="white"/><circle cx="274" cy="200" r="8" fill="white"/>
    <circle cx="240" cy="199" r="4" fill="#1a1a1a"/><circle cx="276" cy="199" r="4" fill="#1a1a1a"/>
    <circle cx="242" cy="197" r="1.5" fill="white"/><circle cx="278" cy="197" r="1.5" fill="white"/>
    <polygon points="248,218 264,218 256,232" fill="#CD853F"/>
    <path d="M196,185 Q196,140 256,135 Q316,140 316,185" fill="none" stroke="#8B1A1A" stroke-width="8" stroke-linecap="round"/>
    <rect x="184" y="178" width="20" height="28" rx="6" fill="#8B1A1A"/><rect x="188" y="184" width="12" height="16" rx="3" fill="#6B1010"/>
    <rect x="308" y="178" width="20" height="28" rx="6" fill="#8B1A1A"/><rect x="312" y="184" width="12" height="16" rx="3" fill="#6B1010"/>
  </svg>
  <h1>The Compute Commons</h1>
  <p class="subtitle">Your gateway to the open web</p>
  <form class="search-form" action="https://lite.duckduckgo.com/lite/" method="get">
    <input class="search-input" type="text" name="q" placeholder="Search with DuckDuckGo..." autofocus>
    <button class="search-btn" type="submit">Search</button>
  </form>
  <p class="link"><a href="https://computecommons.cloud">Try computecommons.cloud</a></p>
</body>
</html>
